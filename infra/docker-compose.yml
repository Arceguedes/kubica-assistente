services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kubica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kubica
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports: ["5678:5678"]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: kubica
      DB_POSTGRESDB_USER: kubica
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      GENERIC_TIMEZONE: America/Fortaleza
    volumes: [n8ndata:/home/node/.n8n]
    depends_on: [postgres]
  ollama:
    image: ollama/ollama
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
volumes:
  pgdata: {}
  n8ndata: {}
  ollama: {}
